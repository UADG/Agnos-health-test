events {
    worker_connections 1024;
}

http {
    # กำหนด upstream ให้ชี้ไปที่ Service ของ Go (ชื่อ api) ที่พอร์ต 8080
    upstream backend {
        server api:8080;
    }

    server {
        listen 80;

        # ส่งทุก Request ที่เข้ามาที่พอร์ต 80 ไปยัง Backend
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}