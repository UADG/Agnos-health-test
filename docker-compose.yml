version: '3.8'

services:
  # 1. Database Service
  postgres_db:
    image: postgres:15-alpine
    container_name: agnos_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agnos_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # 2. Go Backend Service
  api:
    build: .
    container_name: agnos_api
    depends_on:
      - postgres_db
    restart: unless-stopped

  # 3. Nginx Reverse Proxy Service
  nginx:
    image: nginx:alpine
    container_name: agnos_nginx
    ports:
      - "80:80" # เปิดพอร์ต 80 ออกสู่ภายนอก
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped